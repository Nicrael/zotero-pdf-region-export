name: Update update.json on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Append new version to update.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          XPI_URL="https://github.com/${REPO}/releases/download/${TAG}/pdf-region-export-${VERSION}.xpi"
          jq --arg ver "$VERSION" --arg url "$XPI_URL" \
            '.addons["pdf-region-export@andreadamonte"].updates += [{"version": $ver, "update_link": $url}]' \
            update.json > tmp.json && mv tmp.json update.json

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --staged --quiet || git commit -m "chore: add ${TAG} to update.json"
          git push
