name: Release

# Push a tag "vX.Y.Z" matching manifest.json's version. CI builds the .xpi
# from the tagged source, attests its provenance, publishes the GitHub
# release and appends the version to update.json on main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches manifest version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r .version pdf-region-export/manifest.json)
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "xpi=pdf-region-export-$VERSION.xpi" >> "$GITHUB_OUTPUT"
          echo "min=$(jq -r .applications.zotero.strict_min_version pdf-region-export/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "max=$(jq -r .applications.zotero.strict_max_version pdf-region-export/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build xpi (reproducible)
        run: |
          EPOCH=$(git log -1 --format=%ct)
          cd pdf-region-export
          find . -exec touch -h -d "@$EPOCH" {} +
          find . -type f | LC_ALL=C sort | TZ=UTC zip -X -D -@ "../${{ steps.meta.outputs.xpi }}"
          cd ..
          sha256sum "${{ steps.meta.outputs.xpi }}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.meta.outputs.xpi }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.meta.outputs.xpi }}" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Append version to update.json on main
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          XPI: ${{ steps.meta.outputs.xpi }}
          MIN: ${{ steps.meta.outputs.min }}
          MAX: ${{ steps.meta.outputs.max }}
        run: |
          git checkout main
          git pull --ff-only
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${XPI}"
          jq --arg ver "$VERSION" --arg url "$URL" --arg min "$MIN" --arg max "$MAX" '
            .addons["pdf-region-export@andreadamonte"].updates |=
              (map(select(.version != $ver)) + [{
                version: $ver,
                update_link: $url,
                applications: { zotero: { strict_min_version: $min, strict_max_version: $max } }
              }])' update.json > tmp.json && mv tmp.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --staged --quiet || git commit -m "chore: add ${GITHUB_REF_NAME} to update.json"
          git push origin main
